<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050709">
<title>VEIL — Ghost World Camera</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050709;color:#eef4f2;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  #app{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#18201e 0,#080b0c 55%,#020303 100%)}
  video{position:absolute;width:1px;height:1px;opacity:.001;pointer-events:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.08;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.42'/%3E%3C/svg%3E")}
  .top{position:absolute;z-index:5;left:0;right:0;top:0;padding:max(18px,env(safe-area-inset-top)) 18px 0;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
  .brand{font-weight:900;letter-spacing:.34em;font-size:13px;text-shadow:0 2px 12px #000}
  .status{font-size:11px;letter-spacing:.08em;padding:8px 10px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(2,6,6,.45);backdrop-filter:blur(10px);color:#cbd8d4}
  .status b{display:inline-block;width:7px;height:7px;border-radius:50%;background:#8ee7bf;margin-right:7px;box-shadow:0 0 12px #8ee7bf}
  .hud{position:absolute;z-index:5;left:0;right:0;bottom:0;padding:18px 16px max(22px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;justify-content:center;gap:12px;pointer-events:none}
  button{pointer-events:auto;border:0;color:white;background:rgba(8,11,12,.68);backdrop-filter:blur(14px);box-shadow:0 10px 35px rgba(0,0,0,.38)}
  .round{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:21px;border:1px solid rgba(255,255,255,.12)}
  .realm{min-width:170px;height:58px;border-radius:999px;padding:0 22px;font-weight:800;letter-spacing:.08em;border:1px solid rgba(205,255,230,.24);position:relative;overflow:hidden}
  .realm:before{content:"";position:absolute;inset:-30%;background:radial-gradient(circle,rgba(111,255,183,.22),transparent 60%);opacity:.4}
  .realm span{position:relative}
  .realm.on{background:rgba(15,43,35,.78);box-shadow:0 0 32px rgba(61,255,170,.15),0 10px 35px rgba(0,0,0,.45)}
  #intro{position:absolute;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;background:
    radial-gradient(circle at 50% 35%,rgba(38,74,65,.42),transparent 34%),
    linear-gradient(180deg,#080d0e,#020303 75%)}
  .panel{width:min(440px,100%);text-align:center}
  .sigil{width:92px;height:92px;margin:0 auto 22px;border:1px solid rgba(174,241,215,.3);border-radius:50%;position:relative;box-shadow:0 0 60px rgba(107,255,193,.13) inset,0 0 45px rgba(107,255,193,.08)}
  .sigil:before,.sigil:after{content:"";position:absolute;inset:17px;border:1px solid rgba(174,241,215,.24);transform:rotate(45deg)}
  .sigil:after{inset:29px;border-radius:50%;transform:none;background:radial-gradient(circle,#a9f4d0 0 8%,transparent 11%)}
  h1{font-size:clamp(38px,11vw,68px);line-height:.9;margin:0;letter-spacing:.15em;text-indent:.15em}
  .sub{margin:16px auto 26px;max-width:340px;color:#aebbb7;line-height:1.45;font-size:14px}
  #start{width:100%;height:58px;border-radius:16px;font-weight:900;letter-spacing:.08em;background:linear-gradient(180deg,#c7f5df,#83d9b4);color:#07100c;box-shadow:0 14px 42px rgba(76,216,157,.17)}
  .hint{margin-top:13px;font-size:11px;color:#68746f}
  #toast{position:absolute;z-index:20;left:50%;top:86px;transform:translateX(-50%) translateY(-12px);background:rgba(4,8,8,.72);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(12px);padding:10px 14px;border-radius:999px;font-size:12px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .scan{position:absolute;z-index:4;inset:0;pointer-events:none;opacity:0;transition:.35s}
  .scan.on{opacity:.42}
  .scan:before{content:"";position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(147,255,205,.65),transparent);box-shadow:0 0 15px rgba(147,255,205,.3);animation:scan 5s linear infinite}
  @keyframes scan{from{top:8%}to{top:92%}}
</style>
</head>
<body>
<div id="app">
  <video id="cam" playsinline muted></video>
  <canvas id="view"></canvas>
  <div class="grain"></div>
  <div class="scan" id="scan"></div>

  <div class="top">
    <div class="brand">VEIL</div>
    <div class="status" id="status"><b></b><span>kamera</span></div>
  </div>

  <div class="hud" id="hud" style="display:none">
    <button class="round" id="flip" aria-label="Kamera váltás">↻</button>
    <button class="realm" id="realm"><span>NYISD MEG A FÁTYLAT</span></button>
    <button class="round" id="shot" aria-label="Pillanatkép">◎</button>
  </div>

  <div id="intro">
    <div class="panel">
      <div class="sigil"></div>
      <h1>VEIL</h1>
      <div class="sub">A kamera ugyanazt a helyet mutatja — csak nem ugyanabból a világból. Mozgasd lassan a telefont, majd nézz valakire.</div>
      <button id="start">KAMERA INDÍTÁSA</button>
      <div class="hint">A feldolgozás a készüléken történik. Első indításkor az arckövető modell betöltése pár pillanat lehet.</div>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script type="module">
import { FilesetResolver, FaceLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/+esm";

const video = document.getElementById("cam");
const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d", {alpha:false, desynchronized:true});
const intro = document.getElementById("intro");
const hud = document.getElementById("hud");
const startBtn = document.getElementById("start");
const realmBtn = document.getElementById("realm");
const flipBtn = document.getElementById("flip");
const shotBtn = document.getElementById("shot");
const statusEl = document.getElementById("status");
const scan = document.getElementById("scan");
const toastEl = document.getElementById("toast");

let stream = null;
let facing = "environment";
let realm = false;
let faceLandmarker = null;
let modelReady = false;
let running = false;
let lastDetect = 0;
let smoothFace = null;
let lastFrame = performance.now();
let audioCtx = null;
let drone = null;

const fog = Array.from({length:18}, (_,i)=>({
  x:Math.random(), y:Math.random(), r:.08+Math.random()*.16,
  vx:(Math.random()-.5)*.00010, vy:-.00004-Math.random()*.00006,
  a:.018+Math.random()*.05, phase:Math.random()*6.28
}));

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastEl._t);
  toastEl._t=setTimeout(()=>toastEl.classList.remove("show"),1800);
}

function resize(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(innerWidth*dpr);
  canvas.height = Math.round(innerHeight*dpr);
  canvas.style.width = innerWidth+"px";
  canvas.style.height = innerHeight+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize,{passive:true});
resize();

async function initModel(){
  try{
    statusEl.querySelector("span").textContent="AI betöltés";
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm"
    );
    faceLandmarker = await FaceLandmarker.createFromOptions(vision,{
      baseOptions:{
        modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate:"GPU"
      },
      runningMode:"VIDEO",
      numFaces:1,
      minFaceDetectionConfidence:.55,
      minFacePresenceConfidence:.55,
      minTrackingConfidence:.55
    });
    modelReady=true;
    statusEl.querySelector("span").textContent="AI kész";
    toast("Arckövetés aktív");
  }catch(e){
    console.warn(e);
    statusEl.querySelector("span").textContent="effekt mód";
    toast("AI nélkül is fut — az effekt aktív");
  }
}

async function startCamera(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{
      facingMode:{ideal:facing},
      width:{ideal:1280},
      height:{ideal:720},
      frameRate:{ideal:30,max:60}
    }
  });
  video.srcObject=stream;
  await video.play();
  running=true;
  intro.style.display="none";
  hud.style.display="flex";
  statusEl.querySelector("span").textContent="kamera él";
  requestAnimationFrame(render);
  initModel();
}

startBtn.onclick = async()=>{
  try{ await startCamera(); }
  catch(e){
    toast("Kameraengedély szükséges");
    console.error(e);
  }
};

flipBtn.onclick = async()=>{
  facing = facing==="environment" ? "user" : "environment";
  smoothFace=null;
  try{await startCamera();}catch(e){toast("Nem sikerült kamerát váltani");}
};

realmBtn.onclick = ()=>{
  realm=!realm;
  realmBtn.classList.toggle("on",realm);
  scan.classList.toggle("on",realm);
  realmBtn.querySelector("span").textContent = realm ? "ZÁRD BE A FÁTYLAT" : "NYISD MEG A FÁTYLAT";
  if(realm){ startDrone(); toast("A másik oldal közel van"); }
  else{ stopDrone(); }
};

shotBtn.onclick = ()=>{
  try{
    const a=document.createElement("a");
    a.download="veil-"+Date.now()+".jpg";
    a.href=canvas.toDataURL("image/jpeg",.9);
    a.click();
    toast("Pillanatkép elkészült");
  }catch(e){toast("Pillanatkép nem menthető ebben a böngészőben");}
};

function startDrone(){
  try{
    audioCtx=audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended") audioCtx.resume();
    if(drone) return;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain(), f=audioCtx.createBiquadFilter();
    o.type="sine"; o.frequency.value=46;
    f.type="lowpass"; f.frequency.value=110;
    g.gain.value=.018;
    o.connect(f).connect(g).connect(audioCtx.destination);
    o.start();
    drone={o,g};
  }catch(e){}
}
function stopDrone(){
  if(!drone)return;
  try{drone.g.gain.setTargetAtTime(0,audioCtx.currentTime,.08);setTimeout(()=>drone.o.stop(),350);}catch(e){}
  drone=null;
}

function coverRect(sw,sh,dw,dh){
  const s=Math.max(dw/sw,dh/sh);
  const w=dw/s,h=dh/s;
  return {sx:(sw-w)/2,sy:(sh-h)/2,sw:w,sh:h};
}

function mapPoint(p,w,h,mirror){
  return {x:(mirror ? 1-p.x : p.x)*w,y:p.y*h};
}

function detectFace(now,w,h,mirror){
  if(!modelReady || !faceLandmarker || video.readyState<2 || now-lastDetect<65) return;
  lastDetect=now;
  try{
    const r=faceLandmarker.detectForVideo(video,now);
    if(!r.faceLandmarks || !r.faceLandmarks.length){
      smoothFace=null;
      return;
    }
    const lm=r.faceLandmarks[0];
    const pts=lm.map(p=>mapPoint(p,w,h,mirror));
    let minX=1e9,minY=1e9,maxX=-1,maxY=-1;
    for(const p of pts){minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y);}
    const raw={
      cx:(minX+maxX)/2, cy:(minY+maxY)/2,
      w:maxX-minX, h:maxY-minY,
      le:pts[33], re:pts[263], nose:pts[1], mouth:pts[13], chin:pts[152],
      browL:pts[105], browR:pts[334]
    };
    if(!smoothFace) smoothFace=raw;
    else{
      const a=.22;
      for(const k of ["cx","cy","w","h"]) smoothFace[k]+= (raw[k]-smoothFace[k])*a;
      for(const k of ["le","re","nose","mouth","chin","browL","browR"]){
        smoothFace[k].x += (raw[k].x-smoothFace[k].x)*a;
        smoothFace[k].y += (raw[k].y-smoothFace[k].y)*a;
      }
    }
  }catch(e){}
}

function drawWeb(x,y,size,rot,alpha){
  ctx.save();
  ctx.translate(x,y);ctx.rotate(rot);
  ctx.strokeStyle="rgba(213,236,225,"+alpha+")";
  ctx.lineWidth=.7;
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4;
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*size,Math.sin(a)*size);ctx.stroke();
  }
  for(let ring=1;ring<=5;ring++){
    const rr=size*ring/5;
    ctx.beginPath();
    for(let i=0;i<=8;i++){
      const a=i*Math.PI/4;
      const wobble=1+Math.sin(i*2.1+ring)*.035;
      const px=Math.cos(a)*rr*wobble,py=Math.sin(a)*rr*wobble;
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function drawFog(t,w,h){
  ctx.save();
  ctx.globalCompositeOperation="screen";
  for(const f of fog){
    f.x+=f.vx;f.y+=f.vy;
    if(f.x<-.2)f.x=1.2;if(f.x>1.2)f.x=-.2;if(f.y<-.2)f.y=1.1;
    const x=f.x*w + Math.sin(t*.00022+f.phase)*34;
    const y=f.y*h;
    const rr=f.r*Math.max(w,h);
    const g=ctx.createRadialGradient(x,y,0,x,y,rr);
    g.addColorStop(0,"rgba(166,211,190,"+f.a+")");
    g.addColorStop(.45,"rgba(98,145,128,"+(f.a*.55)+")");
    g.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,rr,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function drawMonster(face,t){
  if(!face)return;
  const s=Math.max(face.w,face.h);
  const pulse=1+Math.sin(t*.004)*.018;
  ctx.save();
  ctx.translate(face.cx,face.cy);
  ctx.scale(pulse,pulse);

  const aura=ctx.createRadialGradient(0,0,s*.18,0,0,s*.74);
  aura.addColorStop(0,"rgba(22,72,55,.03)");
  aura.addColorStop(.55,"rgba(43,255,170,.08)");
  aura.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=aura;ctx.beginPath();ctx.arc(0,0,s*.78,0,Math.PI*2);ctx.fill();

  ctx.fillStyle="rgba(3,8,7,.34)";
  ctx.strokeStyle="rgba(186,235,210,.28)";
  ctx.lineWidth=Math.max(1,s*.008);
  ctx.beginPath();
  ctx.ellipse(0,face.h*.01,face.w*.53,face.h*.61,0,0,Math.PI*2);
  ctx.fill();ctx.stroke();

  const eyeY=-face.h*.09, eyeDX=face.w*.23;
  for(const ex of [-eyeDX,eyeDX]){
    const glow=ctx.createRadialGradient(ex,eyeY,0,ex,eyeY,face.w*.15);
    glow.addColorStop(0,"rgba(226,255,238,.95)");
    glow.addColorStop(.16,"rgba(95,255,180,.9)");
    glow.addColorStop(.55,"rgba(49,255,166,.18)");
    glow.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=glow;ctx.beginPath();ctx.arc(ex,eyeY,face.w*.16,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="rgba(0,12,7,.95)";
    ctx.beginPath();ctx.ellipse(ex,eyeY,face.w*.048,face.h*.075,0,0,Math.PI*2);ctx.fill();
  }

  ctx.strokeStyle="rgba(202,236,219,.6)";
  ctx.lineWidth=Math.max(1.2,s*.012);
  ctx.lineCap="round";
  ctx.beginPath();
  ctx.moveTo(-face.w*.08,-face.h*.03);
  ctx.lineTo(-face.w*.02,face.h*.08);
  ctx.lineTo(-face.w*.09,face.h*.15);
  ctx.stroke();

  const my=face.h*.24;
  ctx.fillStyle="rgba(0,0,0,.74)";
  ctx.beginPath();ctx.ellipse(0,my,face.w*.25,face.h*.10,0,0,Math.PI*2);ctx.fill();

  ctx.fillStyle="rgba(211,230,214,.82)";
  const teeth=7;
  for(let i=0;i<teeth;i++){
    const x=-face.w*.19+i*(face.w*.38/(teeth-1));
    const tw=face.w*.045;
    ctx.beginPath();
    ctx.moveTo(x-tw/2,my-face.h*.045);
    ctx.lineTo(x+tw/2,my-face.h*.045);
    ctx.lineTo(x,my+face.h*(i%2?.025:.048));
    ctx.closePath();ctx.fill();
  }

  ctx.strokeStyle="rgba(176,222,202,.42)";
  ctx.lineWidth=Math.max(1,s*.006);
  const cracks=[
    [[-.34,-.31],[-.21,-.20],[-.27,-.09]],
    [[.31,-.25],[.18,-.12],[.23,.00]],
    [[-.38,.08],[-.24,.13],[-.30,.27]]
  ];
  for(const c of cracks){
    ctx.beginPath();
    ctx.moveTo(c[0][0]*face.w,c[0][1]*face.h);
    ctx.lineTo(c[1][0]*face.w,c[1][1]*face.h);
    ctx.lineTo(c[2][0]*face.w,c[2][1]*face.h);
    ctx.stroke();
  }

  ctx.fillStyle="rgba(4,9,8,.86)";
  for(const side of [-1,1]){
    ctx.beginPath();
    ctx.moveTo(side*face.w*.38,-face.h*.40);
    ctx.quadraticCurveTo(side*face.w*.63,-face.h*.73,side*face.w*.19,-face.h*.54);
    ctx.quadraticCurveTo(side*face.w*.32,-face.h*.44,side*face.w*.38,-face.h*.40);
    ctx.fill();
    ctx.strokeStyle="rgba(159,221,192,.26)";ctx.stroke();
  }
  ctx.restore();
}

function render(now){
  if(!running)return;
  const w=innerWidth,h=innerHeight;
  const mirror=facing==="user";

  if(video.readyState>=2){
    const r=coverRect(video.videoWidth,video.videoHeight,w,h);
    ctx.save();
    if(mirror){ctx.translate(w,0);ctx.scale(-1,1);}
    ctx.filter=realm ? "brightness(.58) contrast(1.24) saturate(.48) hue-rotate(52deg)" : "none";
    ctx.drawImage(video,r.sx,r.sy,r.sw,r.sh,0,0,w,h);
    ctx.restore();
    ctx.filter="none";
  }else{
    ctx.fillStyle="#050708";ctx.fillRect(0,0,w,h);
  }

  if(realm){
    ctx.fillStyle="rgba(5,18,14,.16)";ctx.fillRect(0,0,w,h);

    drawFog(now,w,h);
    drawWeb(-8,16,Math.min(w,h)*.34,.10,.17);
    drawWeb(w+8,h*.24,Math.min(w,h)*.26,2.8,.11);

    const vign=ctx.createRadialGradient(w*.5,h*.46,Math.min(w,h)*.18,w*.5,h*.46,Math.max(w,h)*.72);
    vign.addColorStop(0,"rgba(0,0,0,0)");
    vign.addColorStop(.62,"rgba(0,4,4,.08)");
    vign.addColorStop(1,"rgba(0,0,0,.72)");
    ctx.fillStyle=vign;ctx.fillRect(0,0,w,h);

    detectFace(now,w,h,mirror);
    drawMonster(smoothFace,now);

    const flicker=.016 + Math.max(0,Math.sin(now*.0037))*0.012;
    ctx.fillStyle="rgba(197,255,226,"+flicker+")";ctx.fillRect(0,0,w,h);
  }

  lastFrame=now;
  requestAnimationFrame(render);
}
</script>
</body>
</html>
